const iconNode=window.lucide&&window.lucide.icons?window.lucide.icons[name]:null;
if(!iconNode)return null;
return React.createElement("svg",{viewBox:"0 0 24 24",className,fill:"none",stroke:"currentColor",strokeWidth,strokeLinecap:"round",strokeLinejoin:"round"},iconNode.map((segment,index)=>React.createElement(segment[0],{...segment[1],key:index})));
};
const DataService=(()=>{
const localKey="primesat-dz-state-v1";
let firebaseReady=false;
let app=null;
let db=null;
let auth=null;
let storage=null;
try{
if(window.firebaseConfig&&Object.values(window.firebaseConfig).every(v=>typeof v==="string"&&!v.includes("YOUR_")&&!v.includes("YOUR"))){
app=firebase.initializeApp(window.firebaseConfig);
auth=firebase.auth();
db=firebase.firestore();
storage=firebase.storage();
firebase.firestore().enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebaseReady=true;
}else{
throw new Error("placeholder");
}
}catch(err){
firebaseReady=false;
}
const loadState=()=>{
try{
const stored=localStorage.getItem(localKey);
return stored?JSON.parse(stored):null;
}catch(e){
return null;
}
};
const saveState=data=>{
localStorage.setItem(localKey,JSON.stringify(data));
if(firebaseReady&&db){
db.collection("settings").doc("global").set(data,{merge:true});
}
};
const onRemoteSnapshot=callback=>{
if(firebaseReady&&db){
return db.collection("settings").doc("global").onSnapshot(snap=>{
const data=snap.data();
if(data)callback(data);
});
}
return null;
};
const saveBlob=async(file,path)=>{
if(firebaseReady&&storage){
const ref=storage.ref().child(path);
await ref.put(file);
return ref.getDownloadURL();
}
return null;
};
const signIn=async(email,password)=>{
if(firebaseReady&&auth){
const {user}=await auth.signInWithEmailAndPassword(email,password);
return user;
}
return null;
};
return{loadState,saveState,onRemoteSnapshot,saveBlob,signIn,status:()=>({firebaseReady,app,db,auth,storage})};
})();
const deepMerge=(base,incoming)=>{
if(Array.isArray(incoming))return incoming.slice();
const output=Array.isArray(base)?base.slice():{...base};
Object.keys(incoming||{}).forEach(key=>{
const baseValue=output[key];
const nextValue=incoming[key];
if(nextValue&&typeof nextValue==="object"&&!Array.isArray(nextValue)){
output[key]=deepMerge(baseValue||{},nextValue);
}else{
output[key]=nextValue;
}
});
return output;
};

},

});
}
return list;
};
